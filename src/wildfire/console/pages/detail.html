<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan Detail — Wildfire Console</title>
<link rel="stylesheet" href="/static/console.css">
<style>
  .preview-box { overflow:hidden; }
  #stage { transform-origin: 0 0; }
  /* Locate-a-detection ring. Uses the severity token rather than a hex copy so
     it tracks the palette; colour-mix supplies the fading halo. */
  @keyframes focusPulse {
    0%, 100% { box-shadow: 0 0 0 3px var(--red),
                           0 0 18px 6px color-mix(in srgb, var(--red) 53%, transparent); }
    50%      { box-shadow: 0 0 0 10px color-mix(in srgb, var(--red) 80%, transparent),
                           0 0 26px 10px color-mix(in srgb, var(--red) 67%, transparent); }
  }
  #det-table [data-di] { cursor: pointer; }
  #det-table [data-di]:hover { background: #faf9f4; }
  #overlay { position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
  /* Boxes are drawn live over the original photo in both view and review mode.
     non-scaling-stroke keeps a line 2 px on screen at any zoom, and --fs (set
     from the zoom in applyZoom) keeps labels ~12 px on screen - they used to be
     burned into the JPEG in image pixels, unreadable at fit and huge zoomed in. */
  #overlay rect.box { fill:transparent; stroke-width:2px; vector-effect:non-scaling-stroke; cursor:pointer; }
  #overlay rect.box.sel { stroke-dasharray:6 4; stroke-width:3px; }
  #overlay.view { pointer-events:none; }
  #overlay text { font:600 var(--fs, 15px) 'IBM Plex Mono',monospace; paint-order:stroke; stroke:#000c;
                  stroke-width:.24em; fill:#fff; pointer-events:none; }
  .layer-bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:7px 16px;
               border-bottom:1px solid var(--line-soft); font-size:11px; color:var(--muted-2); }
  .layer-bar .kind-toggle { padding:3px 9px; font-size:11px; }
  .conf { font:600 10.5px var(--mono); padding:1px 7px; border-radius:10px; border:1px solid var(--border-2); }
  .conf.high { color:var(--green); border-color:var(--green-line); background:var(--green-bg); }
  .conf.medium { color:var(--amber-text); }
  .conf.low { color:var(--muted-3); }
  .edit-bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 16px; background:#f2f8f2; border-bottom:1px solid var(--green-line); }
</style>
</head>
<body>
<nav id="topnav" class="topnav"></nav>

<div class="page" style="padding-top:20px;">
  <a class="link-green" href="/scans" style="display:inline-flex; align-items:center; gap:6px; margin-bottom:14px;">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#2D5A2D" stroke-width="2"><path d="M15 18l-6-6 6-6"></path></svg>
    Back to Scans
  </a>

  <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:20px; flex-wrap:wrap; margin:6px 0 18px;">
    <div>
      <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
        <h1 class="h1" id="d-title">Scan Detail</h1>
        <button type="button" id="d-rename" class="btn-quiet" style="padding:4px 10px; font-size:12px;"
                title="Give this scan a name of your own">&#9998; Rename</button>
      </div>
      <form id="d-rename-form" style="display:none; align-items:center; gap:8px; margin:6px 0 4px;">
        <input class="input" id="d-rename-input" maxlength="80" style="width:min(420px, 60vw);"
               aria-label="Run name" placeholder="e.g. Canmore Creek - north block">
        <button type="submit" class="btn btn-primary" style="padding:7px 14px;">Save name</button>
        <button type="button" class="btn-quiet" id="d-rename-cancel" style="padding:7px 12px;">Cancel</button>
        <span style="font-size:11px; color:var(--muted-3);">empty = name from capture time</span>
      </form>
      <p class="sub" id="d-sub"></p>
      <p class="sub" id="d-when" style="margin-top:2px; font-size:12px;"></p>
      <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:11px;" id="d-chips"></div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
      <div style="display:flex; gap:10px;">
        <button id="d-redetect" class="btn btn-outline" style="display:none;"
                title="Run the current detector over this scan's original photos, as a new scan">&#8635; Re-detect</button>
        <button id="d-edit" class="btn btn-outline">✎ Review boxes</button>
        <button id="d-upload" class="btn btn-outline" style="display:none;">☁ Sync to cloud</button>
        <button id="d-report" class="btn btn-primary">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6M9 15h6M9 11h2"></path></svg>
          Generate Report
        </button>
      </div>
      <span class="mono" id="d-cloud-status" style="font-size:11px; color:var(--muted-3);"></span>
    </div>
  </div>

  <!-- Shown when the page was opened from a map site rather than the run list -->
  <div id="filter-banner" style="display:none; align-items:center; justify-content:space-between;
       gap:12px; margin-bottom:14px; padding:9px 14px; border-radius:9px;
       background:var(--green-bg); border:1px solid var(--green-line);">
    <span style="font-size:12px; color:var(--green);" id="filter-text"></span>
    <button id="filter-clear" class="btn-quiet" style="padding:4px 11px; font-size:11px; white-space:nowrap;">
      Show the whole run
    </button>
  </div>

  <div style="display:grid; grid-template-columns:1fr 360px; gap:16px;">
    <!-- left: viewer / editor. min-width:0 lets the column shrink so the
         thumbnail strip scrolls inside its card instead of stretching the page. -->
    <div style="display:flex; flex-direction:column; gap:16px; min-width:0;">
      <div class="card" style="overflow:hidden;">
        <!-- One row. The file name and index used to sit here as well, but the
             sidebar's "This image" card now owns which frame you are on, and
             printing it twice on the same screen just added noise. What stays is
             what acts on the viewer. -->
        <div class="card-head" style="padding:11px 16px;">
          <div style="display:flex; align-items:center; gap:10px; min-width:0;">
            <span class="card-title" id="viewer-title">Detection Preview</span>
            <span class="mono" style="font-size:11px; color:var(--muted-3);" id="review-progress"></span>
            <span class="mono" style="font-size:10px; color:var(--muted-3);" id="zoom-hint"></span>
          </div>
          <div style="display:flex; align-items:center; gap:10px;">
            <button id="mark-reviewed" class="btn-quiet" style="padding:5px 11px; font-size:12px;">&#10003; Mark reviewed</button>
            <div class="view-toggle" id="view-toggle">
              <button data-v="annotated" class="on" title="The original photo with the boxes drawn over it">Boxes</button>
              <button data-v="original">Original</button>
              <button data-v="gridmap">Grid</button>
            </div>
          </div>
        </div>

        <div class="layer-bar" id="layer-bar">
          <span style="font-weight:600;">Show</span>
          <span id="layer-kinds" style="display:inline-flex; gap:6px; flex-wrap:wrap;"></span>
          <label style="display:inline-flex; align-items:center; gap:5px; margin-left:4px;">
            <input type="checkbox" id="layer-labels"> labels</label>
        </div>

        <div class="edit-bar" id="edit-bar" style="display:none;">
          <span style="font-size:12px; font-weight:600; color:var(--green);">Review mode</span>
          <select id="label-pick" class="select">
            <option>Dead Tree</option><option>Fallen Tree</option><option>Flame</option><option>Smoke</option>
          </select>
          <button id="del-box" class="btn-quiet" style="padding:6px 10px;" disabled>Delete box</button>
          <span style="font-size:11px; color:var(--muted-2); flex:1; min-width:0;">
            <span class="edit-hint-text">Drag to add a box · click to select · what you leave here is what gets confirmed · </span>
            <button type="button" id="show-keys" class="btn-link" style="font-size:11px;">
              <span class="kbd">?</span> shortcuts</button>
          </span>
          <span class="dirty-note" id="dirty-note"></span>
          <button id="cancel-edit" class="btn-quiet" style="padding:6px 12px;">Cancel</button>
          <button id="save-review" class="btn btn-primary" style="padding:7px 14px; font-size:12px;">Save review → training set</button>
        </div>

        <div class="preview-box" id="preview">
          <span class="mono" style="color:#cdd6c0; opacity:.5; font-size:12px;">loading…</span>
        </div>
        <div class="thumb-strip" id="thumbs"></div>
      </div>
    </div>

    <!-- right: THIS IMAGE first, then the run. The panel used to describe only
         the run, which never changed while the operator flipped through 58
         frames one at a time - so the column they were staring at answered a
         question they had already read. Run-level facts are still here, folded
         away, because they are looked up once and not watched. -->
    <div id="side-col" style="display:flex; flex-direction:column; gap:12px;">
      <div class="card" style="padding:15px 17px;">
        <div style="display:flex; align-items:baseline; justify-content:space-between; gap:8px;">
          <span style="font-size:13px; font-weight:600;">This image</span>
          <span class="mono" style="font-size:11px; color:var(--muted-3);" id="img-index"></span>
        </div>
        <div class="mono" style="font-size:11px; color:var(--muted-2); margin-top:3px;
             overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" id="img-name"></div>
        <div style="display:flex; align-items:center; gap:7px; margin-top:9px;" id="img-badges"></div>
        <div style="display:flex; flex-direction:column; gap:8px; margin-top:12px;" id="img-rows"></div>
      </div>

      <!-- Moved here from under the viewer. It is per-image data, so it belongs
           with the per-image card, and it fills the column that was otherwise
           empty below the fold. Scrolls internally: a dense frame carries 60+
           boxes and the list must not stretch the page. -->
      <div class="card" style="overflow:hidden; display:flex; flex-direction:column;" id="det-table-card">
        <div class="card-head" style="padding:12px 16px;">
          <span class="card-title" id="det-table-title">Detections in this image</span>
          <span class="mono" style="font-size:11px; color:var(--muted-3);" id="det-count"></span>
        </div>
        <div id="det-table" style="overflow-y:auto; max-height:38vh;"></div>
      </div>

      <details class="card" id="run-details" style="padding:0;">
        <summary style="cursor:pointer; padding:13px 17px; font-size:13px; font-weight:600;
                        display:flex; align-items:center; justify-content:space-between; gap:8px;">
          <span>Whole scan</span>
          <span id="run-summary-chip" style="font-weight:400;"></span>
        </summary>
        <div style="padding:0 17px 15px;">
          <div class="risk-hero none" id="risk-hero" style="padding:13px 15px; margin-bottom:14px;">
            <div style="font-size:10px; font-weight:600; letter-spacing:.4px; opacity:.85;">WORST IMAGE IN THIS RUN</div>
            <div style="font-size:22px; font-weight:700; margin-top:3px; line-height:1;" id="risk-label">—</div>
            <div style="font-size:11px; margin-top:7px; opacity:.9;" id="risk-note"></div>
          </div>
          <div style="display:flex; flex-direction:column; gap:12px;" id="summary-rows"></div>
          <div style="height:1px; background:var(--line); margin:14px 0;"></div>
          <div style="display:flex; flex-direction:column; gap:8px;" id="session-rows"></div>
          <a class="btn-quiet" style="display:none; text-align:center; margin-top:14px;"
             id="d-pdf" target="_blank" rel="noopener">Open latest report</a>
        </div>
      </details>
    </div>
  </div>
</div>

<script src="/static/console.js"></script>
<script>
renderNav("scans");
const RUN_ID = decodeURIComponent(location.pathname.split("/").pop());

/* ?images=a.jpg|b.jpg narrows the page to the frames taken at one hazard site,
   so opening a map pin shows that location rather than the whole flight.
   ALL_IMAGES keeps the full run so the filter can be lifted without a reload. */
const PARAMS = new URLSearchParams(location.search);
const IMAGE_FILTER = (PARAMS.get("images") || "").split("|").filter(Boolean);
const FILTER_LABEL = PARAMS.get("from") || "selection";
let ALL_IMAGES = null;

let DETAIL = null;
let curImage = 0;
let curView = "annotated";
let EDIT = false;
let boxesByImage = {};   // imageIndex -> [{x1,y1,x2,y2,label}]
let selBox = -1;
let drawing = null;

/* ------------------------------------------------- unsaved review work
   Review is long work - a 100-image flight is ~3,000 boxes - and it used to be
   one click from loss: any nav link, the Back link, or a stray d/s/r/m/p/e key
   left the page and dropped everything. Three layers now: every way of leaving
   asks first (WF_LEAVE_GUARD, console.js); every change is also written to a
   local draft, so a closed window or a crash can be recovered on reopen; and
   changes can be undone one step at a time. */
let DIRTY = false;
const TOUCHED = new Set();        // image indices whose boxes were changed
let HISTORY = [], FUTURE = [];    // undo / redo: snapshots of one image's boxes
const DRAFT_KEY = `wf.reviewDraft.${RUN_ID}`;
const UNDO_LIMIT = 300;

const cloneBoxes = boxes => boxes.map(b => ({ ...b }));

function remember() {             // call BEFORE changing the current image's boxes
  HISTORY.push({ i: curImage, boxes: cloneBoxes(initBoxes(curImage)), sel: selBox });
  if (HISTORY.length > UNDO_LIMIT) HISTORY.shift();
  FUTURE = [];
}

function changed() {              // call AFTER changing the current image's boxes
  DIRTY = true;
  TOUCHED.add(curImage);
  saveDraft();
  updateDirtyNote(); updateEditControls(); drawPreview(); drawDetTable();
}

function stepHistory(from, to) {
  if (!from.length) { toast(from === HISTORY ? "Nothing to undo" : "Nothing to redo", 1500); return; }
  const snap = from.pop();
  to.push({ i: snap.i, boxes: cloneBoxes(initBoxes(snap.i)), sel: selBox });
  if (snap.i !== curImage) { curImage = snap.i; resetZoom(); }
  boxesByImage[snap.i] = snap.boxes;
  selBox = snap.sel < snap.boxes.length ? snap.sel : -1;
  DIRTY = true; TOUCHED.add(snap.i); saveDraft();
  updateDirtyNote(); updateEditControls(); drawPreview(); drawDetTable();
}
const undo = () => stepHistory(HISTORY, FUTURE);
const redo = () => stepHistory(FUTURE, HISTORY);

function saveDraft() {
  try {
    const images = {};
    for (const i of TOUCHED) images[DETAIL.images_detail[i].name] = initBoxes(i);
    localStorage.setItem(DRAFT_KEY, JSON.stringify({ saved_at: new Date().toISOString(), images }));
  } catch (e) { /* storage blocked or full: the leave guard still protects navigation */ }
}
function readDraft() {
  try { return JSON.parse(localStorage.getItem(DRAFT_KEY)); } catch (e) { return null; }
}
function clearDraft() {
  try { localStorage.removeItem(DRAFT_KEY); } catch (e) { /* nothing to clear */ }
}
function resetDirty() {
  DIRTY = false; TOUCHED.clear(); HISTORY = []; FUTURE = [];
  clearDraft(); updateDirtyNote();
}

function updateDirtyNote() {
  const n = TOUCHED.size;
  document.getElementById("dirty-note").textContent =
    DIRTY ? `Unsaved changes · ${n} image${n === 1 ? "" : "s"}` : "";
}

window.WF_LEAVE_GUARD = () => DIRTY
  ? `You have unsaved review changes on ${TOUCHED.size} image${TOUCHED.size === 1 ? "" : "s"}. `
    + "Leave without saving them? They stay in a local draft you can restore when you come back."
  : "";

/* Review-editor box colors. These MUST match KIND in console.js and the BGR
   constants in annotate.py — they drifted before (#E53935/#FB8C00 here vs
   #E05555/#F0A500 everywhere else), so the drawn box and the saved annotation
   disagreed on shade. Driven off KIND now, every type included - "Fallen Log"
   used to be a hard-coded purple that no other surface knew about. */
const LABEL_COLORS = {
  "Dead Tree": KIND.deadtree.color,
  "Fallen Tree": KIND.fallen.color,
  "Flame": KIND.flame.color,
  "Smoke": KIND.smoke.color,
};
/* What earned the badge - phrased as "the worst image", because that is what it
   measures. SEV_NOTE is the fallback for runs with no per-image breakdown. */
const SEV_DRIVER = {
  high: "Driven by the worst image: flame, or heavy dead-tree density.",
  medium: "Driven by the worst image: smoke, or elevated dead-tree density.",
  low: "Worst image holds scattered dead trees. Schedule field verification.",
  none: "No hazards detected in this scan.",
};
const SEV_NOTE = {
  high: "Flame or heavy dead-tree density in this run. Review and verify on site.",
  medium: "Smoke or elevated dead-tree density. Review the flagged images.",
  low: "Scattered dead trees / other hazards detected. Schedule field verification.",
  none: "No hazards detected in this scan.",
};

/* ---------------------------------------------------------- zoom & pan
   Zoom is applied as an explicit WIDTH on #stage, not as transform: scale().
   A transform magnifies the bitmap the browser already rasterised at the fitted
   size — about 900 px of a 5280 px frame — so at 4x the operator was studying a
   900 px image blown up four times while the other 4000 px of real detail were
   never drawn. Setting the width makes the browser re-rasterise from the
   decoded source instead, and the box overlay is SVG in native image
   coordinates, so it stays vector-sharp at any zoom.

   Panning stays a transform (it moves pixels, it does not resample them). The
   editor's coordinate math reads getBoundingClientRect, which reflects both. */
let zoom = 1, panX = 0, panY = 0, fitW = 0;
let panning = null;

/* The frame's fitted width at 1x, measured from the browser's own layout so
   console.css remains the only place that decides how a frame fits its box. */
function measureFit() {
  const st = document.getElementById("stage");
  const img = document.getElementById("stage-img");
  if (!st || !img) return;
  st.classList.remove("zoomed");
  st.style.width = "";
  fitW = img.getBoundingClientRect().width || 0;
  applyZoom();
}
window.addEventListener("resize", measureFit);

/* Is any of the frame outside the viewing box right now? Panning keys off this
   rather than off `zoom > 1`, so content can never be both hidden and
   unreachable - which is exactly what happened when a sizing bug let the image
   overflow at 1x: the bottom of every frame was cropped and dragging did
   nothing, because dragging was only allowed once you had zoomed in. */
function contentOverflows() {
  const st = document.getElementById("stage");
  const box = document.getElementById("preview");
  if (!st || !box) return false;
  const s = st.getBoundingClientRect(), b = box.getBoundingClientRect();
  return s.width > b.width + 1 || s.height > b.height + 1;
}

function applyZoom() {
  const st = document.getElementById("stage");
  if (st) {
    const scaled = zoom !== 1 && fitW > 0;
    st.classList.toggle("zoomed", scaled);
    st.style.width = scaled ? (fitW * zoom) + "px" : "";
    st.style.transform = `translate(${panX}px, ${panY}px)`;
  }
  updateOverlayScale();
  // Only shown when there is somewhere to go; at 1x on a fitted image it was
  // permanent instructions taking space from the header.
  const hint = document.getElementById("zoom-hint");
  if (zoom > 1) hint.textContent = `${zoom.toFixed(1)}× · drag: pan · dbl-click: reset`;
  else hint.textContent = contentOverflows() ? "drag: pan · dbl-click: reset" : "";
}

function resetZoom() { zoom = 1; panX = panY = 0; applyZoom(); }

const previewEl = document.getElementById("preview");
previewEl.addEventListener("wheel", e => {
  const st = document.getElementById("stage");
  if (!st) return;
  e.preventDefault();
  const rect = st.getBoundingClientRect();
  const nz = Math.min(12, Math.max(1, zoom * (e.deltaY < 0 ? 1.25 : 0.8)));
  if (nz === zoom) return;
  const u = (e.clientX - rect.left) / zoom;  // cursor point in content coords
  const v = (e.clientY - rect.top) / zoom;
  panX -= u * (nz - zoom);
  panY -= v * (nz - zoom);
  zoom = nz;
  if (zoom === 1) { panX = panY = 0; }
  applyZoom();
}, { passive: false });

previewEl.addEventListener("pointerdown", e => {
  // In edit mode dragging draws boxes. Otherwise pan whenever something is off
  // screen, whether that is because of zoom or because the frame does not fit.
  if (EDIT || (zoom === 1 && !contentOverflows())) return;
  panning = { x: e.clientX, y: e.clientY };
  previewEl.setPointerCapture(e.pointerId);
});
previewEl.addEventListener("pointermove", e => {
  if (!panning) return;
  panX += e.clientX - panning.x;
  panY += e.clientY - panning.y;
  panning = { x: e.clientX, y: e.clientY };
  applyZoom();
});
previewEl.addEventListener("pointerup", () => { panning = null; });
previewEl.addEventListener("dblclick", resetZoom);

// Hazard TYPE of an image (for thumbnail border color) — same language as the
// detection boxes and the map: flame > smoke > dead tree.
function imgKind(im) {
  if ((im.counts || {})["Flame"]) return "flame";
  if ((im.counts || {})["Smoke"]) return "smoke";
  if ((im.counts || {})["Dead Tree"]) return "deadtree";
  if ((im.counts || {})["Fallen Tree"]) return "fallen";
  if (Object.values(im.counts || {}).reduce((a, b) => a + b, 0)) return "deadtree";
  return null;
}

/* ------------------------------------------------------------- edit state */
/* What an image shows: the reviewer's verdict when there is one, the model's
   proposals otherwise. The view-mode list used to read raw proposals even on a
   reviewed run, so boxes deleted in review were still listed. */
function sourceBoxes(im) {
  return im.confirmed != null
    ? im.confirmed.map(c => ({ x1: c.xyxy[0], y1: c.xyxy[1], x2: c.xyxy[2], y2: c.xyxy[3], label: c["class"], score: null }))
    : (im.detections || []).map(d => ({ x1: d.xyxy[0], y1: d.xyxy[1], x2: d.xyxy[2], y2: d.xyxy[3], label: d.display, score: d.score }));
}

function initBoxes(i) {
  if (!boxesByImage[i]) boxesByImage[i] = sourceBoxes(DETAIL.images_detail[i]);
  return boxesByImage[i];
}

/* The boxes on screen right now: the working copy while reviewing, the saved
   state otherwise. */
function shownBoxes(i) {
  return EDIT ? initBoxes(i) : sourceBoxes(DETAIL.images_detail[i]);
}

/* Which types and whether labels are drawn - a per-viewer preference. */
const LAYER_KEY = "wf.viewLayers";
const LAYERS = (() => {
  try {
    const saved = JSON.parse(localStorage.getItem(LAYER_KEY));
    if (saved) return { hidden: new Set(saved.hidden || []), labels: !!saved.labels };
  } catch (e) { /* first visit */ }
  // labels off by default: on a 30-box frame they cover the photo, and the
  // colours plus the legend above already say the type
  return { hidden: new Set(), labels: false };
})();
function saveLayers() {
  try { localStorage.setItem(LAYER_KEY, JSON.stringify({ hidden: [...LAYERS.hidden], labels: LAYERS.labels })); }
  catch (e) { /* storage blocked: the choice just is not remembered */ }
}

function drawLayerBar() {
  const bar = document.getElementById("layer-bar");
  const showBoxes = EDIT || curView === "annotated";
  bar.style.display = showBoxes ? "" : "none";
  if (!showBoxes) return;
  const present = new Set(ALL_IMAGES.flatMap(im => sourceBoxes(im).map(b => b.label)));
  const labels = Object.keys(LABEL_COLORS).filter(l => present.has(l));
  // Hiding a type while reviewing would hide boxes that still get saved, so the
  // type toggles are a viewing aid only.
  document.getElementById("layer-kinds").innerHTML = EDIT ? "" : labels.map(l => {
    const on = !LAYERS.hidden.has(l);
    return `<button type="button" class="kind-toggle${on ? "" : " off"}" data-layer="${esc(l)}" aria-pressed="${on}">
      ${kindIcon(kindForLabel(l), 11)} ${esc(l)}</button>`;
  }).join("");
  document.getElementById("layer-labels").checked = LAYERS.labels;
}
document.getElementById("layer-kinds").addEventListener("click", e => {
  const b = e.target.closest("[data-layer]");
  if (!b) return;
  const l = b.dataset.layer;
  LAYERS.hidden.has(l) ? LAYERS.hidden.delete(l) : LAYERS.hidden.add(l);
  saveLayers(); drawLayerBar(); drawPreview();
});
document.getElementById("layer-labels").addEventListener("change", e => {
  LAYERS.labels = e.target.checked; saveLayers(); drawPreview();
  e.target.blur();
});

/* Box size in metres when the ground resolution is known, pixels otherwise -
   "[3914, 1316, 4080, 1409]" meant nothing to a forester. */
function boxSize(b, im) {
  const w = b.x2 - b.x1, h = b.y2 - b.y1;
  if (im.gsd_cm) {
    const m = v => (v * im.gsd_cm / 100).toFixed(v * im.gsd_cm / 100 < 10 ? 1 : 0);
    return `${m(w)} \u00d7 ${m(h)} m`;
  }
  return `${Math.round(w)} \u00d7 ${Math.round(h)} px`;
}

/* Confidence as a band, the exact figure on hover. The alive/dead classifier
   reports 1.00 for most of what it keeps, and a column of "100%" claimed a
   certainty nothing in this pipeline has. */
function confBand(score) {
  if (score == null) return '<span class="conf" title="drawn or confirmed by a reviewer">manual</span>';
  const band = score >= 0.85 ? "high" : score >= 0.6 ? "medium" : "low";
  return `<span class="conf ${band}" title="model confidence ${(score * 100).toFixed(0)}%">${band}</span>`;
}

/* ------------------------------------------------------------- preview */
function imageSrc(im) {
  if (EDIT) return im.original_url;
  // Boxes view: the clean original with boxes drawn live (see overlaySvg); the
  // burned-in annotated JPEG is only the fallback for a run without originals.
  if (curView === "annotated") return im.original_url || im.annotated_url;
  if (curView === "annotated" && DETAIL.reviewed && im.confirmed_annotated_url) return im.confirmed_annotated_url;
  if (curView === "gridmap" && DETAIL.reviewed && im.confirmed_gridmap_url) return im.confirmed_gridmap_url;
  return im[curView + "_url"] || im.annotated_url || im.original_url;
}

function overlaySvg(im) {
  const W = im.width || 1, H = im.height || 1;
  const boxes = shownBoxes(curImage);
  let inner = "";
  boxes.forEach((b, i) => {
    if (!EDIT && LAYERS.hidden.has(b.label)) return;
    const c = LABEL_COLORS[b.label] || KIND.deadtree.color;
    inner += `<rect class="box ${EDIT && i === selBox ? "sel" : ""}" data-bi="${i}" x="${b.x1}" y="${b.y1}"
      width="${b.x2 - b.x1}" height="${b.y2 - b.y1}" stroke="${c}"></rect>`;
    if (LAYERS.labels || (EDIT && i === selBox)) {
      // above the box, or inside it when the box touches the top edge
      inner += `<text x="${b.x1}" y="${b.y1}" dx="0.15em" dy="${b.y1 < H * 0.03 ? "1.1em" : "-0.35em"}">${esc(b.label)}</text>`;
    }
  });
  if (EDIT && drawing && drawing.x2 !== undefined) {
    inner += `<rect class="box" x="${Math.min(drawing.x1, drawing.x2)}" y="${Math.min(drawing.y1, drawing.y2)}"
      width="${Math.abs(drawing.x2 - drawing.x1)}" height="${Math.abs(drawing.y2 - drawing.y1)}"
      stroke="#fff" stroke-dasharray="8 5"></rect>`;
  }
  return `<svg id="overlay" class="${EDIT ? "" : "view"}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${inner}</svg>`;
}

/* Labels stay ~12 px on screen whatever the zoom: their size is set in image
   units from how wide the frame is drawn right now. */
function updateOverlayScale() {
  const ov = document.getElementById("overlay"), img = document.getElementById("stage-img");
  const im = DETAIL && DETAIL.images_detail[curImage];
  if (!ov || !img || !im) return;
  const drawn = img.getBoundingClientRect().width || 1;
  ov.style.setProperty("--fs", `${(12 * (im.width || 1)) / drawn}px`);
}

function drawPreview() {
  const ims = DETAIL.images_detail;
  const box = document.getElementById("preview");
  if (!ims.length) {
    box.innerHTML = '<span class="mono" style="color:#cdd6c0; opacity:.5; font-size:12px;">No per-image data for this run.</span>';
    return;
  }
  curImage = Math.min(curImage, ims.length - 1);
  const im = ims[curImage];
  const url = imageSrc(im);
  // A results-only run genuinely has no photo to show; say that plainly instead
  // of the generic "image unavailable", which reads like something broke.
  const empty = DETAIL.results_only
    ? `Results synced from ${esc((DETAIL.synced_from || {}).machine || "another machine")}<br>
       <span style="opacity:.7;">detections and GPS are here; the photos stayed on that machine</span>`
    : esc(im.error || "image unavailable");
  box.innerHTML = url
    ? `<div id="stage" style="position:relative; line-height:0;"
            title="wheel: zoom · drag: pan · double-click: reset">
         <img id="stage-img" src="${esc(url)}" alt="${esc(im.name)}" draggable="false">
         ${EDIT || (curView === "annotated" && im.original_url) ? overlaySvg(im) : ""}
       </div>`
    : `<span class="mono" style="color:#cdd6c0; opacity:.5; font-size:12px; text-align:center; line-height:1.7;">${empty}</span>`;
  // #stage is rebuilt above, so fitW belongs to an element that no longer
  // exists; re-measure once the new frame has laid out.
  const simg = document.getElementById("stage-img");
  if (simg) {
    simg.addEventListener("load", measureFit);
    if (simg.complete) measureFit();
  } else {
    fitW = 0;
  }
  // File name and index live in the sidebar's "This image" card now.
  document.getElementById("thumbs").innerHTML = ims.map((t, i) => {
    const kind = imgKind(t);
    // Check only images the operator explicitly marked reviewed (not auto).
    const check = t.reviewed_by_user ? '<span class="thumb-check">&#10003;</span>' : "";
    // No imagery was synced for an imported run, so a thumbnail request would
    // 404 into a broken-image icon per frame. Show a labelled chip instead -
    // the strip is still how you move between images.
    if (DETAIL.results_only) {
      const n = (t.detections || []).length;
      const c = kind ? KIND[kind].color : "var(--border-2)";
      return `<div class="thumb-wrap ${i === curImage ? "sel" : ""}" data-i="${i}" title="${esc(t.name)}">
                <div class="thumb" style="display:flex; flex-direction:column; align-items:center;
                     justify-content:center; border-left:3px solid ${c}; background:#f4f6f7; width:74px;">
                  <span class="mono" style="font-size:9px; color:var(--muted-2);">${esc(t.name.slice(-8))}</span>
                  <span class="mono" style="font-size:11px; font-weight:600;">${n}</span>
                </div>${check}
              </div>`;
    }
    // Server-side small thumbs + lazy loading: a 100-image strip must not pull
    // 100 full-resolution annotated JPEGs into the page.
    const src = `/api/run-thumb/${encodeURIComponent(RUN_ID)}/${encodeURIComponent(t.name)}`;
    return `<div class="thumb-wrap ${i === curImage ? "sel" : ""}" data-i="${i}" title="${esc(t.name)}">
              <img class="thumb ${kind ? "k-" + kind : ""}" loading="lazy" src="${src}" alt="${esc(t.name)}">${check}
            </div>`;
  }).join("");
  document.querySelectorAll("#thumbs [data-i]").forEach(el =>
    el.addEventListener("click", () => goToImage(+el.dataset.i)));
  const sel = document.querySelector("#thumbs .thumb-wrap.sel");
  if (sel) sel.scrollIntoView({ block: "nearest", inline: "nearest" });
  applyZoom();  // innerHTML replaced the stage — restore the current transform
  drawLayerBar();
  if (EDIT) wireOverlay();
  drawReviewControls();
  // Hooked here rather than at every call site: this already runs on every
  // image change, so the sidebar cannot fall out of step with the viewer.
  drawImagePanel();
}

function goToImage(i) {
  const n = DETAIL.images_detail.length;
  if (!n || i < 0 || i >= n || i === curImage) return;
  curImage = i; selBox = -1; drawing = null;
  resetZoom(); drawPreview(); drawDetTable();
}

/* Per-image review check — an explicit operator action, persisted server-side. */
function drawReviewControls() {
  const ims = DETAIL.images_detail;
  const btn = document.getElementById("mark-reviewed");
  const done = ims.filter(i => i.reviewed_by_user).length;
  document.getElementById("review-progress").textContent =
    ims.length ? `reviewed ${done} / ${ims.length}` : "";
  // Reviewing needs the photo, which a results-only import does not have. This
  // runs after the initial hide, so it has to re-check rather than assume.
  if (!ims.length || DETAIL.results_only) { btn.style.display = "none"; return; }
  btn.style.display = "";
  const on = !!ims[curImage].reviewed_by_user;
  btn.innerHTML = on ? "&#10003; Reviewed &middot; undo" : "&#10003; Mark reviewed";
  btn.style.background = on ? "var(--green-bg)" : "";
  btn.style.color = on ? "var(--green)" : "";
  btn.style.borderColor = on ? "var(--green-line)" : "";
}

document.getElementById("mark-reviewed").addEventListener("click", () =>
  setImageReviewed(!(DETAIL.images_detail[curImage] || {}).reviewed_by_user));

async function setImageReviewed(next) {
  const ims = DETAIL.images_detail;
  if (!ims.length || DETAIL.results_only) return false;
  const im = ims[curImage];
  if (!!im.reviewed_by_user === next) return true;
  const btn = document.getElementById("mark-reviewed");
  btn.disabled = true;
  try {
    await api(`/api/scans/${encodeURIComponent(RUN_ID)}/image-reviewed`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: im.name, reviewed: next }),
    });
    im.reviewed_by_user = next;   // local update — no full reload
    drawPreview();
    return true;
  } catch (e) {
    toast("Could not update review state: " + e.message, 6000);
    return false;
  } finally {
    btn.disabled = false;
  }
}

/* ------------------------------------------------------------- editor wiring */
function svgPoint(svg, ev) {
  const r = svg.getBoundingClientRect();
  const im = DETAIL.images_detail[curImage];
  return { x: (ev.clientX - r.left) * (im.width / r.width),
           y: (ev.clientY - r.top) * (im.height / r.height) };
}

function wireOverlay() {
  const svg = document.getElementById("overlay");
  if (!svg) return;
  svg.addEventListener("pointerdown", ev => {
    const bi = ev.target.getAttribute && ev.target.getAttribute("data-bi");
    if (bi !== null && bi !== undefined) {
      selBox = +bi;
      document.getElementById("label-pick").value = initBoxes(curImage)[selBox].label;
      updateEditControls(); drawPreview();
      return;
    }
    const p = svgPoint(svg, ev);
    drawing = { x1: p.x, y1: p.y };
    svg.setPointerCapture(ev.pointerId);
  });
  svg.addEventListener("pointermove", ev => {
    if (!drawing) return;
    const p = svgPoint(svg, ev);
    drawing.x2 = p.x; drawing.y2 = p.y;
    drawPreview();
  });
  svg.addEventListener("pointerup", () => {
    if (drawing && drawing.x2 !== undefined) {
      const im = DETAIL.images_detail[curImage];
      const b = { x1: Math.max(0, Math.min(drawing.x1, drawing.x2)), y1: Math.max(0, Math.min(drawing.y1, drawing.y2)),
                  x2: Math.min(im.width, Math.max(drawing.x1, drawing.x2)), y2: Math.min(im.height, Math.max(drawing.y1, drawing.y2)),
                  label: document.getElementById("label-pick").value };
      if (b.x2 - b.x1 > 12 && b.y2 - b.y1 > 12) {
        remember();
        initBoxes(curImage).push(b);
        selBox = initBoxes(curImage).length - 1;
        drawing = null;
        changed();
        return;
      }
    } else if (drawing) {
      selBox = -1; // plain click on empty space deselects
    }
    drawing = null;
    updateEditControls(); drawPreview(); drawDetTable();
  });
}

function updateEditControls() {
  document.getElementById("del-box").disabled = selBox < 0;
}

function deleteSelected() {
  if (!EDIT || selBox < 0) return;
  remember();
  initBoxes(curImage).splice(selBox, 1);
  selBox = -1;
  changed();
}

function setLabel(label) {
  const pick = document.getElementById("label-pick");
  pick.value = label;
  if (EDIT && selBox >= 0 && initBoxes(curImage)[selBox].label !== label) {
    remember();
    initBoxes(curImage)[selBox].label = label;
    changed();
  }
}

function selectNextBox(step) {
  const n = initBoxes(curImage).length;
  if (!n) return;
  focusDetection(((selBox < 0 ? (step > 0 ? -1 : 0) : selBox) + step + n) % n);
}

/* Review is keyboard-first: a flight is thousands of boxes, and every one used
   to need the mouse. Digits and arrows only - letters belong to the page nav,
   which is switched off while reviewing. */
const LABEL_KEYS = ["Dead Tree", "Fallen Tree", "Flame", "Smoke"];   // 1-4, the dropdown order

const SHORTCUTS = [
  ["&larr; &rarr;", "Previous / next image"],
  ["Enter", "Mark this image reviewed and go to the next"],
  ["1 2 3 4", "Label: Dead Tree, Fallen Tree, Flame, Smoke (selected box, and new boxes)"],
  ["Tab / Shift+Tab", "Select the next / previous box and zoom to it"],
  ["Delete", "Delete the selected box"],
  ["Ctrl+Z / Ctrl+Shift+Z", "Undo / redo (Cmd on a Mac)"],
  ["Ctrl+S", "Save the review"],
  ["Esc", "Deselect, then reset the zoom"],
  ["?", "Show this list"],
];

function showShortcuts() {
  const back = document.createElement("div");
  back.className = "wf-modal-back";
  back.innerHTML = `<div class="wf-modal" role="dialog" aria-modal="true" aria-label="Keyboard shortcuts">
      <div style="font-size:15px; font-weight:600;">Keyboard shortcuts</div>
      <div class="shortcut-sheet">${SHORTCUTS.map(([k, what]) =>
        `<span>${k.split(" / ").map(x => `<span class="kbd">${x}</span>`).join(" / ")}</span><span>${what}</span>`).join("")}</div>
      <div class="wf-modal-actions"><button type="button" class="btn btn-primary" data-close>Close</button></div>
    </div>`;
  const close = () => { back.remove(); document.removeEventListener("keydown", onKey, true); };
  const onKey = e => { if (e.key === "Escape" || e.key === "?") { e.preventDefault(); e.stopPropagation(); close(); } };
  back.addEventListener("click", e => { if (e.target === back || e.target.closest("[data-close]")) close(); });
  document.addEventListener("keydown", onKey, true);
  document.body.appendChild(back);
  back.querySelector("[data-close]").focus();
}
document.getElementById("show-keys").addEventListener("click", showShortcuts);

document.addEventListener("keydown", ev => {
  if (!DETAIL || document.querySelector(".wf-modal-back")) return;
  const tag = document.activeElement?.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || document.activeElement?.isContentEditable) return;
  const mod = ev.ctrlKey || ev.metaKey;
  const key = ev.key;
  const handled = () => ev.preventDefault();

  if (mod && key.toLowerCase() === "z" && EDIT) { handled(); ev.shiftKey ? redo() : undo(); return; }
  if (mod && key.toLowerCase() === "y" && EDIT) { handled(); redo(); return; }
  if (mod && key.toLowerCase() === "s" && EDIT) { handled(); document.getElementById("save-review").click(); return; }
  if (mod || ev.altKey) return;

  if (key === "?") { handled(); showShortcuts(); return; }
  if (key === "ArrowLeft") { handled(); goToImage(curImage - 1); return; }
  if (key === "ArrowRight") { handled(); goToImage(curImage + 1); return; }
  if (key === "Enter") {
    handled();
    setImageReviewed(true).then(ok => { if (ok) goToImage(curImage + 1); });
    return;
  }
  if (key === "Escape") {
    if (selBox >= 0) { selBox = -1; updateEditControls(); drawPreview(); }
    else resetZoom();
    return;
  }
  if (!EDIT) return;
  if (key === "Delete" || key === "Backspace") { handled(); deleteSelected(); return; }
  if (key === "Tab") { handled(); selectNextBox(ev.shiftKey ? -1 : 1); return; }
  const n = "1234".indexOf(key);
  if (n >= 0) { handled(); setLabel(LABEL_KEYS[n]); }
});

document.getElementById("del-box").addEventListener("click", deleteSelected);

document.getElementById("label-pick").addEventListener("change", e => {
  setLabel(e.target.value);
  e.target.blur();   // or the arrow keys would keep changing the dropdown
});

function setEdit(on) {
  EDIT = on;
  window.WF_SUPPRESS_NAV_KEYS = on;
  selBox = -1; drawing = null;
  document.getElementById("edit-bar").style.display = on ? "" : "none";
  document.getElementById("d-edit").textContent = on ? "✎ Reviewing…" : "✎ Review boxes";
  document.getElementById("view-toggle").style.visibility = on ? "hidden" : "visible";
  document.getElementById("viewer-title").textContent = on ? "Review — confirm the boxes" : "Detection Preview";
  updateEditControls(); drawPreview(); drawDetTable();
}

document.getElementById("d-edit").addEventListener("click", () => setEdit(!EDIT));

document.getElementById("d-redetect").addEventListener("click", async e => {
  const btn = e.currentTarget;
  const go = await wfConfirm(
    `Run the current detector over the ${plural(DETAIL.images, "original photo")} again? `
    + "The result is a NEW scan; this one and its review are kept as they are.",
    { ok: "Re-detect" });
  if (!go) return;
  btn.disabled = true;
  try {
    const res = await api(`/api/scans/${encodeURIComponent(DETAIL.id)}/redetect`, { method: "POST" });
    toast(`Re-detecting ${plural(res.images, "image")}`
      + (res.missing ? ` (${res.missing} no longer on disk)` : "") + " \u2014 progress is on the Scans page");
    wfNavigate("/scans");
  } catch (err) {
    toast("Could not re-detect: " + err.message, 8000);
  } finally {

  }
});
document.getElementById("cancel-edit").addEventListener("click", async () => {
  if (DIRTY) {
    const n = TOUCHED.size;
    const discard = await wfConfirm(
      `Discard your changes on ${n} image${n === 1 ? "" : "s"}? This cannot be undone.`,
      { ok: "Discard changes", cancel: "Keep editing", danger: true });
    if (!discard) return;
  }
  boxesByImage = {};
  resetDirty();
  setEdit(false);
});

document.getElementById("save-review").addEventListener("click", async () => {
  const btn = document.getElementById("save-review");
  btn.disabled = true; btn.textContent = "Saving…";
  try {
    DETAIL.images_detail.forEach((_, i) => initBoxes(i)); // untouched images keep their current boxes
    const payload = {};
    DETAIL.images_detail.forEach((im, i) => {
      payload[im.name] = boxesByImage[i].map(b => ({ xyxy: [b.x1, b.y1, b.x2, b.y2], "class": b.label }));
    });
    const res = await api(`/api/scans/${encodeURIComponent(RUN_ID)}/labels`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ labels: payload }),
    });
    DETAIL = res.detail;
    ALL_IMAGES = res.detail.images_detail;
    boxesByImage = {};
    resetDirty();
    setEdit(false);
    draw();
    toast(`Saved ${res.saved} confirmed box${res.saved === 1 ? "" : "es"} — added to the training set (labels.json).`);
  } catch (e) {
    toast("Save failed: " + e.message, 8000);
  } finally {
    btn.disabled = false; btn.textContent = "Save review → training set";
  }
});

/* The panel for the frame currently on screen. Redrawn on every image change,
   which is the point: this is the part of the sidebar that should move when the
   operator moves. */
function drawImagePanel() {
  const ims = DETAIL.images_detail;
  const idx = document.getElementById("img-index");
  const name = document.getElementById("img-name");
  const badges = document.getElementById("img-badges");
  const rows = document.getElementById("img-rows");
  if (!ims.length) {
    idx.textContent = ""; name.textContent = "—";
    badges.innerHTML = ""; rows.innerHTML = "";
    return;
  }
  const im = ims[curImage];
  const counts = im.counts || {};
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  // This frame's own grade, using the same ladder as the run - so a quiet frame
  // inside a High run is visibly quiet.
  const sev = imageSeverity(counts);

  idx.textContent = `${curImage + 1} / ${ims.length}`;
  name.textContent = im.name;
  name.title = im.name;
  badges.innerHTML = sevBadge(sev)
    + (im.reviewed_by_user
        ? '<span class="badge low">&#10003; REVIEWED</span>'
        : '<span class="badge none">not reviewed</span>');

  const kv = (k, v, mono = true) => `
    <div class="kv"><span class="k">${esc(k)}</span>
      <span class="${mono ? "v" : ""}" style="${mono ? "" : "font-size:12px;"}">${esc(v)}</span></div>`;
  const typeRows = Object.entries(counts).map(([k, v]) => `
    <div style="display:flex; align-items:center; justify-content:space-between;">
      <span style="display:inline-flex; align-items:center; gap:7px; font-size:12px; color:var(--text-2);">
        <span style="width:9px; height:9px; border-radius:2px; background:${LABEL_COLORS[k] || "#d4af37"};"></span>${esc(k)}</span>
      <span class="mono" style="font-size:13px; font-weight:600;">${v}</span>
    </div>`).join("");

  rows.innerHTML =
    (typeRows || '<div style="font-size:12px; color:var(--muted-3);">No detections in this image.</div>')
    + `<div style="height:1px; background:var(--line); margin:2px 0;"></div>`
    + kv("Detections", total)
    + kv("GPS", im.gps ? fmtCoord(im.gps[0], im.gps[1]) : "not embedded")
    + (im.altitude != null ? kv("Altitude", `${Number(im.altitude).toFixed(1)} m`) : "")
    + (im.timestamp ? kv("Captured", fmtExif(im.timestamp)) : "")
    + (im.confirmed ? kv("Confirmed boxes", im.confirmed.length) : "");
}

/* Same ladder as the run badge, applied to one frame. */
function imageSeverity(counts) {
  if (counts["Flame"]) return "high";
  const dead = counts["Dead Tree"] || 0;
  const fallen = counts["Fallen Tree"] || 0;
  const t = DETAIL.severity_thresholds || {};
  // Same rule as data.display_severity: a 0 threshold leaves fallen ungraded.
  const fallenHit = thr => thr > 0 && fallen >= thr;
  if (dead >= (t.high ?? 39) || fallenHit(t.fallen_high ?? 46)) return "high";
  if (counts["Smoke"] || dead >= (t.medium ?? 13) || fallenHit(t.fallen_medium ?? 7)) return "medium";
  return Object.values(counts).some(v => v) ? "low" : null;
}

/* ------------------------------------------------------------- tables & panels */
function drawDetTable() {
  const ims = DETAIL.images_detail;
  const color = l => LABEL_COLORS[l] || "#d4af37";
  let rows, title;
  const im = ims[curImage];
  title = EDIT ? "Boxes in this image (unsaved)"
        : im && im.confirmed != null ? "Confirmed in this image" : "Detections in this image";
  rows = ims.length ? shownBoxes(curImage) : [];
  document.getElementById("det-table-title").textContent = title;
  document.getElementById("det-count").textContent =
    `${rows.length} box${rows.length === 1 ? "" : "es"} · click a row to locate it`;
  document.getElementById("det-table").innerHTML = rows.length ? `
    <div style="max-height:260px; overflow-y:auto;">${rows.map((r, di) => `
      <div data-di="${di}" title="Click to zoom to this detection"
           style="display:flex; align-items:center; justify-content:space-between; padding:9px 16px; border-bottom:1px solid var(--line-soft); font-size:12px;">
        <span style="display:inline-flex; align-items:center; gap:8px;">
          <span style="width:9px; height:9px; border-radius:2px; background:${color(r.label)};"></span>${esc(r.label)}
        </span>
        <span class="mono" style="color:var(--muted-2);">${boxSize(r, im)}</span>
        ${confBand(r.score)}
      </div>`).join("")}</div>`
    : '<div class="empty" style="padding:20px;">No boxes in this image.</div>';
  document.querySelectorAll("#det-table [data-di]").forEach(el =>
    el.addEventListener("click", () => focusDetection(+el.dataset.di)));
}

/* Click a detection row -> zoom the preview onto that box and spotlight it.
   A 100-px flame in a 5280-px frame is invisible at fit-to-screen. */
function focusDetection(di) {
  const ims = DETAIL.images_detail;
  if (!ims.length) return;
  const im = ims[curImage];
  const b = shownBoxes(curImage)[di];
  if (!b) return;
  if (EDIT) { selBox = di; updateEditControls(); }
  else if (curView !== "annotated") { curView = "annotated"; syncViewToggle(); }   // the box must be visible
  resetZoom();
  drawPreview();
  setTimeout(() => {  // not rAF: fires even when the tab is backgrounded
    const stage = document.getElementById("stage");
    if (!stage) return;
    const rc = previewEl.getBoundingClientRect();
    const r0 = stage.getBoundingClientRect();   // measured at zoom 1
    const W = im.width || 1, H = im.height || 1;
    const bw = Math.max((b.x2 - b.x1) / W * r0.width, 4);
    const bh = Math.max((b.y2 - b.y1) / H * r0.height, 4);
    zoom = Math.min(12, Math.max(1.5, Math.min(rc.width / (bw * 3), rc.height / (bh * 3))));
    const sx = (b.x1 + b.x2) / 2 / W * r0.width;   // box center, stage-local @1x
    const sy = (b.y1 + b.y2) / 2 / H * r0.height;
    panX = rc.left + rc.width / 2 - r0.left - sx * zoom;
    panY = rc.top + rc.height / 2 - r0.top - sy * zoom;
    applyZoom();
    const old = document.getElementById("focus-ring");
    if (old) old.remove();
    const ring = document.createElement("div");
    ring.id = "focus-ring";
    ring.style.cssText =
      `position:absolute; left:${b.x1 / W * 100}%; top:${b.y1 / H * 100}%;` +
      `width:${(b.x2 - b.x1) / W * 100}%; height:${(b.y2 - b.y1) / H * 100}%;` +
      `border:2px solid #fff; pointer-events:none; animation:focusPulse 1s ease-in-out 5; z-index:5;`;
    stage.appendChild(ring);
    setTimeout(() => ring.remove(), 5200);
  }, 30);
}

function drawSummary() {
  const counts = DETAIL.detections_by_type || {};
  const color = k => LABEL_COLORS[k] || "#d4af37";
  let rows = Object.entries(counts).map(([k, v]) => `
    <div style="display:flex; align-items:center; justify-content:space-between;">
      <span style="display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--text-2);">
        <span style="width:9px; height:9px; border-radius:2px; background:${color(k)};"></span>${esc(k)} detections</span>
      <span class="mono" style="font-size:15px; font-weight:600;">${v}</span>
    </div>`).join("");
  if (!rows) rows = '<div style="font-size:12px; color:var(--muted-3);">No detections in this scan.</div>';
  if (DETAIL.avg_confidence != null && !DETAIL.reviewed) {
    rows += `
      <div style="height:1px; background:var(--line);"></div>
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <span style="font-size:13px; color:var(--text-2);">Avg confidence</span>
        <span class="mono" style="font-size:15px; font-weight:600;">${Math.round(DETAIL.avg_confidence * 100)}%</span>
      </div>
      <div class="hbar"><div style="width:${Math.round(DETAIL.avg_confidence * 100)}%;"></div></div>
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <span style="font-size:13px; color:var(--text-2);">Peak confidence</span>
        <span class="mono" style="font-size:15px; font-weight:600;">${Math.round(DETAIL.peak_confidence * 100)}%</span>
      </div>`;
  }
  rows += DETAIL.reviewed
    ? `<div style="font-size:11px; color:var(--green-2); font-weight:600;">✓ Reviewed — counts are the confirmed boxes (labels.json, feeds the next training round)</div>`
    : `<div style="font-size:11px; color:var(--muted-3);">Unreviewed AI proposals — click “Review boxes” to confirm them.</div>`;
  document.getElementById("summary-rows").innerHTML = rows;
}

function drawSession() {
  const bi = DETAIL.batch_info || {};
  const kv = (k, v) => `<div class="kv"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`;
  document.getElementById("session-rows").innerHTML = [
    ...(bi.operator ? [kv("Operator", bi.operator)] : []),
    kv("Drone / camera", DETAIL.drone || "not in EXIF"),
    kv("GPS", DETAIL.gps ? fmtCoord(DETAIL.gps[0], DETAIL.gps[1]) : "not embedded"),
    kv("Images", DETAIL.images),
    kv("Detectors", bi.model_count ?? "—"),
    // Which computer produced the run, GPU as a tooltip. Runs made before
    // `machine` was recorded only have the device string, so they are labelled
    // for what that actually is rather than passing a graphics card off as a
    // machine name.
    bi.machine
      ? `<div class="kv" title="${esc(bi.device || "")}"><span class="k">Processed on</span>` +
        `<span class="v">${esc(bi.machine)}</span></div>`
      : kv("Compute device", bi.device || "—"),
    kv("Conf / slice", bi.conf_threshold != null ? `${bi.conf_threshold} / ${bi.slice_size}px` : "—"),
    kv("Generated", bi.generated_at || DETAIL.created),
  ].join("");
  const pdf = document.getElementById("d-pdf");
  if (DETAIL.report_url) { pdf.style.display = ""; pdf.href = DETAIL.report_url; }
}

function draw() {
  // The flight's name, not "Scan Detail - <when the analysis ran>": the analysis
  // date can be a year after the flight, and the run id says nothing to a crew.
  document.getElementById("d-title").textContent = DETAIL.title || DETAIL.id;
  document.title = `${DETAIL.title || DETAIL.id} \u2014 Wildfire Console`;
  document.getElementById("d-sub").textContent =
    `${plural(DETAIL.images, "image")} · ${countsLine(DETAIL.detections_by_type)}`;
  const flown = DETAIL.flown_date
    ? `Flown ${DETAIL.flown_date}${DETAIL.flown_time ? " · " + DETAIL.flown_time : ""}`
    : "Capture time not in the photos' EXIF";
  document.getElementById("d-when").textContent = `${flown} — analysed ${DETAIL.analysed}`;
  const chips = [`<span class="chip mono">${esc(DETAIL.id)}</span>`];
  if (DETAIL.drone) chips.push(`<span class="chip">Drone: ${esc(DETAIL.drone)}</span>`);
  if (DETAIL.reviewed) chips.push('<span class="chip" style="color:var(--green); border-color:var(--green-line);">Reviewed</span>');
  const sev = DETAIL.severity || "none";
  chips.push(`<span class="badge ${sev}" style="font-size:11px; padding:3px 9px;">${sev === "none" ? "NO DETECTIONS" : SEV[sev].label.toUpperCase() + " SEVERITY"}</span>`);
  if (DETAIL.detector_stale) chips.push(staleChip(DETAIL).replace('class="badge stale"',
    'class="badge stale" style="font-size:11px; padding:3px 9px;"'));
  // Offered on any scan whose photos are still where they were, but only
  // pressed on the operator's eye for stale ones - a fresh run re-detected
  // gives the same answer.
  const redetect = document.getElementById("d-redetect");
  redetect.style.display = DETAIL.can_redetect && !DETAIL.results_only ? "" : "none";
  redetect.className = DETAIL.detector_stale ? "btn btn-primary" : "btn btn-outline";
  if (DETAIL.results_only) {
    const from = (DETAIL.synced_from || {}).machine || "another machine";
    chips.push(`<span class="chip" title="Only the findings were synced — the photos stay on the machine that flew the mission.">☁ Results only · from ${esc(from)}</span>`);
  }
  document.getElementById("d-chips").innerHTML = chips.join("");
  // An imported run has findings but no imagery, so the actions that need a
  // photo (box review, re-upload) cannot work and are hidden rather than left
  // to fail on click.
  if (DETAIL.results_only) {
    for (const id of ["d-edit", "d-upload", "mark-reviewed"]) {
      const el = document.getElementById(id);
      if (el) el.style.display = "none";
    }
  }

  /* The hero states the WORST image, and then says how the run is actually made
     up. It used to assert "Flame detected or heavy dead-tree density" over the
     whole run, so a flight with flame in 6 of 58 frames read as if all 58 were
     alight. The label says which image drove it; the note gives the spread. */
  const hero = document.getElementById("risk-hero");
  const mix = DETAIL.severity_mix;
  hero.className = "risk-hero " + sev;
  document.getElementById("risk-label").textContent = sev === "none" ? "Clear" : SEV[sev].label;
  document.getElementById("risk-note").innerHTML = mix
    ? `${esc(SEV_DRIVER[sev] || "")}<br><span style="opacity:.85;">Across ${DETAIL.images} images: `
      + `${["high", "medium", "low"].filter(k => mix[k]).map(k => `${mix[k]} ${SEV[k].label.toLowerCase()}`).join(", ")}`
      + `${mix.none ? `, ${mix.none} clear` : ""}`
      + `${DETAIL.flame_images ? ` &middot; flame in ${DETAIL.flame_images}` : ""}.</span>`
    : esc(SEV_NOTE[sev] || "");

  // The fold has to be worth leaving closed, so its header carries the badge
  // and the mix bar rather than just the word "Whole run".
  document.getElementById("run-summary-chip").innerHTML =
    sevBadge(sev) + " " + sevMixBar(DETAIL.severity_mix, DETAIL.images);

  drawPreview(); drawDetTable(); drawSummary(); drawSession();
}

/* Rename: a run's title is the operator's to set. Empty goes back to the name
   built from capture time. */
const renameForm = document.getElementById("d-rename-form");
const renameInput = document.getElementById("d-rename-input");
document.getElementById("d-rename").addEventListener("click", () => {
  renameForm.style.display = "flex";
  renameInput.value = DETAIL.title_custom ? DETAIL.title : "";
  renameInput.placeholder = DETAIL.title || "";
  renameInput.focus();
});
document.getElementById("d-rename-cancel").addEventListener("click", () => { renameForm.style.display = "none"; });
renameInput.addEventListener("keydown", e => { if (e.key === "Escape") renameForm.style.display = "none"; });
renameForm.addEventListener("submit", async e => {
  e.preventDefault();
  try {
    const res = await api(`/api/scans/${encodeURIComponent(RUN_ID)}/title`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title: renameInput.value }),
    });
    DETAIL.title = res.title; DETAIL.title_custom = res.title_custom;
    renameForm.style.display = "none";
    draw();
    toast(res.title_custom ? "Run renamed." : "Name reset to the capture time.");
  } catch (err) {
    toast("Could not rename: " + err.message, 6000);
  }
});

function syncViewToggle() {
  document.querySelectorAll("#view-toggle button").forEach(x => x.classList.toggle("on", x.dataset.v === curView));
}
document.getElementById("view-toggle").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  curView = b.dataset.v;
  syncViewToggle();
  drawPreview();
});

const REPORT_ICON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6M9 15h6M9 11h2"></path></svg>';

document.getElementById("d-report").addEventListener("click", async () => {
  const btn = document.getElementById("d-report");
  btn.disabled = true; btn.textContent = "Starting…";
  try {
    // Report runs in a background thread; poll status so a big flight cannot
    // freeze the window (100-image reports used to hang the app).
    await api(`/api/scans/${encodeURIComponent(RUN_ID)}/report`, { method: "POST" });
    const done = await new Promise((resolve, reject) => {
      const timer = setInterval(async () => {
        let s;
        try { s = await api(`/api/scans/${encodeURIComponent(RUN_ID)}/report/status`); }
        catch (e) { return; }  // transient, keep polling
        if (s.stage) btn.textContent = s.stage + "…";
        if (s.state === "done") { clearInterval(timer); resolve(s); }
        if (s.state === "error") { clearInterval(timer); reject(new Error(s.error || "failed")); }
      }, 1200);
    });
    if (done.note) toast(done.note, 8000);
    DETAIL.report_url = done.report_url;
    drawSession();
    if (done.report_url) window.open(done.report_url, "_blank");
  } catch (e) {
    toast("Report failed: " + e.message, 8000);
  } finally {
    btn.disabled = false;
    btn.innerHTML = REPORT_ICON + " Generate Report";
  }
});

function paintCloudStatus(s) {
  const el = document.getElementById("d-cloud-status");
  if (!s || s.state === "idle" || s.synced === false) { el.textContent = "Not synced yet"; return; }
  if (s.state === "running") { el.textContent = `Syncing… ${s.done || 0}/${s.total || "?"}`; return; }
  if (s.state === "error") { el.textContent = "Sync failed: " + (s.error || ""); return; }
  const when = s.synced_at || "";
  el.textContent = when ? `Synced to cloud · ${when}` : "Synced to cloud";
}

document.getElementById("d-upload").addEventListener("click", async () => {
  const btn = document.getElementById("d-upload");
  btn.disabled = true; btn.textContent = "Syncing…";
  try {
    await api(`/api/scans/${encodeURIComponent(RUN_ID)}/upload`, { method: "POST" });
    const done = await new Promise((resolve, reject) => {
      const timer = setInterval(async () => {
        let s;
        try { s = await api(`/api/scans/${encodeURIComponent(RUN_ID)}/upload/status`); }
        catch (e) { return; }  // transient, keep polling
        paintCloudStatus(s);
        if (s.state === "done") { clearInterval(timer); resolve(s); }
        if (s.state === "error") { clearInterval(timer); reject(new Error(s.error || "failed")); }
      }, 1000);
    });
    const parts = [];
    if (done.uploaded) parts.push(`${done.uploaded} uploaded`);
    if (done.skipped) parts.push(`${done.skipped} unchanged`);
    if (done.failed) parts.push(`${done.failed} failed`);
    toast(`Cloud sync complete — ${parts.join(", ") || "nothing to do"}.`, 6000);
  } catch (e) {
    toast("Sync failed: " + e.message, 8000);
  } finally {
    btn.disabled = false; btn.textContent = "☁ Sync to cloud";
  }
});

api("/api/settings").then(s => {
  if (s.values.cloud_enabled) {
    document.getElementById("d-upload").style.display = "";
    api(`/api/scans/${encodeURIComponent(RUN_ID)}/upload/status`).then(paintCloudStatus).catch(() => {});
  }
}).catch(() => {});

/* Applying the filter to images_detail (rather than filtering at every use)
   means the viewer, thumbnails, detection table and review editor all narrow
   together and their index arithmetic keeps working untouched. Saving a review
   while filtered would write only the visible frames, so review is blocked
   until the filter is cleared. */
let FILTER_CLEARED = false;

function applyImageFilter() {
  const banner = document.getElementById("filter-banner");
  if (!ALL_IMAGES) return;
  if (!IMAGE_FILTER.length || FILTER_CLEARED) {
    DETAIL.images_detail = ALL_IMAGES;
    banner.style.display = "none";
    document.getElementById("d-edit").disabled = false;
    return;
  }
  const want = new Set(IMAGE_FILTER);
  const hit = ALL_IMAGES.filter(im => want.has(im.name));
  DETAIL.images_detail = hit.length ? hit : ALL_IMAGES;
  banner.style.display = "flex";
  document.getElementById("filter-text").innerHTML = hit.length
    ? `Showing <b>${hit.length}</b> image${hit.length === 1 ? "" : "s"} from `
      + `<b>${esc(FILTER_LABEL)}</b> &mdash; ${ALL_IMAGES.length} in the full scan.`
    : `None of ${esc(FILTER_LABEL)}'s images are in this scan; showing all ${ALL_IMAGES.length}.`;
  // Review edits the whole run's labels, so it cannot run on a subset.
  document.getElementById("d-edit").disabled = hit.length > 0;
}

document.getElementById("filter-clear").addEventListener("click", () => {
  FILTER_CLEARED = true;
  curImage = 0;
  applyImageFilter();
  draw();
});

/* A draft left by a closed window, a crash or "Leave without saving" is offered
   back - never applied silently, because the run may have been reviewed since. */
function offerDraft() {
  const draft = readDraft();
  if (!draft || !draft.images || DETAIL.results_only) return;
  const index = new Map(ALL_IMAGES.map((im, i) => [im.name, i]));
  const usable = Object.entries(draft.images).filter(([name]) => index.has(name));
  if (!usable.length) { clearDraft(); return; }
  const when = new Date(draft.saved_at);
  const bar = document.createElement("div");
  bar.className = "card";
  bar.style.cssText = "display:flex; align-items:center; gap:12px; padding:10px 16px; margin-bottom:14px;"
    + "border-color:var(--amber); background:#fff8e6;";
  bar.innerHTML = `<span style="font-size:13px; flex:1;">Unsaved review changes on <b>${usable.length}</b>
      image${usable.length === 1 ? "" : "s"} from ${esc(when.toLocaleString())} were found on this computer.</span>
    <button type="button" class="btn-quiet" data-a="discard">Discard</button>
    <button type="button" class="btn btn-primary" data-a="restore">Restore and continue</button>`;
  bar.addEventListener("click", async e => {
    const b = e.target.closest("[data-a]");
    if (!b) return;
    if (b.dataset.a === "discard") {
      if (!await wfConfirm("Discard the saved draft? This cannot be undone.",
                           { ok: "Discard draft", cancel: "Keep it", danger: true })) return;
      clearDraft(); bar.remove(); return;
    }
    if (IMAGE_FILTER.length && !FILTER_CLEARED) { FILTER_CLEARED = true; applyImageFilter(); }
    for (const [name, boxes] of usable) {
      boxesByImage[index.get(name)] = cloneBoxes(boxes);
      TOUCHED.add(index.get(name));
    }
    DIRTY = true;
    bar.remove();
    setEdit(true);
    updateDirtyNote();
    toast("Draft restored - save to keep it.");
  });
  const grid = document.getElementById("filter-banner");
  grid.parentNode.insertBefore(bar, grid);
}

api(`/api/scans/${encodeURIComponent(RUN_ID)}`)
  .then(d => {
    DETAIL = d;
    ALL_IMAGES = d.images_detail;
    applyImageFilter();
    draw();
    offerDraft();
  })
  .catch(e => {
    document.getElementById("d-title").textContent = "Scan not found";
    document.getElementById("d-sub").textContent = e.message;
  });
</script>
</body>
